name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex_test
          POSTGRES_DB: cortex_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: apps/api/package-lock.json }

      - run: npm ci
        working-directory: apps/api

      - run: npm run lint
        working-directory: apps/api

      - run: npm run test:cov
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://cortex:cortex_test@localhost:5432/cortex_test
          JWT_SECRET: test_secret
          OPENAI_API_KEY: sk-test-fake

  worker:
    name: Worker — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pytest
        working-directory: workers/document-processor
      - run: python -m py_compile handler.py
        working-directory: workers/document-processor

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cortex-api:test apps/api
      - run: docker build -t cortex-worker:test workers/document-processor
